# CPU Frequency Controller Configuration File
# /etc/cpu-freq-controller.conf
#
# This file contains configuration parameters for the CPU frequency controller.
# Uncomment and modify values to override defaults.
#
# All temperature values are in millidegrees Celsius (1000 = 1°C)
# All frequency values are in kHz (1000 kHz = 1 MHz)
# All time values are in seconds

# Temperature check interval in seconds
# Default: 2
#TEMP_CHECK_INTERVAL=2

# Upper temperature limit in millidegrees (e.g., 65000 = 65°C)
# When temperature exceeds this value, frequency reduction begins
# Default: 65000 (65°C)
#TEMP_UPPER_LIMIT=65000

# Temperature hysteresis in millidegrees (e.g., 5000 = 5°C)
# Temperature must drop below (TEMP_UPPER_LIMIT - TEMP_HYSTERESIS) before frequency increases
# Default: 5000 (5°C)
#TEMP_HYSTERESIS=5000

# Initial delay in seconds before frequency reduction
# Frequency reduction only starts after temperature has been elevated for this duration
# AND the cooling fan is active
# This applies at startup AND when reducing from cpuinfo_max_freq (boost frequencies)
# Default: 30
#INITIAL_DELAY=30

# Frequency step in kHz (e.g., 100000 = 100 MHz)
# Amount by which frequency is adjusted in each step
# Default: 100000 (100 MHz)
#FREQ_STEP=100000

# Frequency decrease interval in seconds
# How often to reduce frequency when temperature is above threshold
# Default: 20
#FREQ_DECREASE_INTERVAL=20

# Frequency increase interval in seconds
# How often to increase frequency when temperature is below threshold
# Default: 10
#FREQ_INCREASE_INTERVAL=10

# Maximum frequency limit in kHz (e.g., 2000000 = 2 GHz)
# Upper limit for controlled frequency range (below boost frequencies)
# Frequencies between this value and cpuinfo_max_freq are skipped
# Default: 2000000 (2 GHz)
#MAX_FREQ_LIMIT=2000000

# Verbose logging (0=minimal, 1=debug)
# Default: 1
#VERBOSE=1
